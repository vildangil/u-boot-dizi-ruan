name: Build U-Boot for Dizi (SM7435)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libgnutls28-dev \
                                  bison flex device-tree-compiler mkbootimg

      - name: Configure (qcom_defconfig + phone + dizi)
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output qcom_defconfig
          ./scripts/kconfig/merge_config.sh -m -O .output .output/.config \
              board/qualcomm/qcom-phone.config \
              board/qualcomm/dizi.config
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output olddefconfig

      - name: Verify config
        run: |
          set -e
          for opt in CONFIG_MISC CONFIG_USB_DWC3 CONFIG_USB_DWC3_GADGET \
                     CONFIG_USB_DWC3_GENERIC CONFIG_USB_GADGET \
                     CONFIG_MSM_GENI_SERIAL CONFIG_USB_FUNCTION_FASTBOOT \
                     CONFIG_VIDEO_SIMPLE CONFIG_PANIC_HANG \
                     CONFIG_BOARD_EARLY_INIT_F; do
            grep -q "^${opt}=y" .output/.config || { echo "::error::MISSING ${opt}=y"; exit 1; }
          done
          grep -q '^CONFIG_DEFAULT_DEVICE_TREE="qcom/dizi"' .output/.config \
            || { echo "::error::wrong device tree"; exit 1; }
          echo "--- key settings ---"
          grep -E '^CONFIG_(DEFAULT_DEVICE_TREE|TEXT_BASE|SYS_BOARD|SYS_VENDOR|DEBUG_UART_BASE|ENV_DEFAULT_ENV_TEXT_FILE)=' .output/.config

      - name: Build
        run: make CROSS_COMPILE=aarch64-linux-gnu- O=.output -j$(nproc)

      - name: Verify binary
        run: |
          set -e
          grep -q 'board_early_init_f' .output/System.map \
            || { echo "::error::board/xiaomi/dizi/board.c NOT linked"; exit 1; }
          strings .output/u-boot.bin | grep -q 'dwc3-generic' \
            || { echo "::error::dwc3-generic driver NOT in binary"; exit 1; }
          strings .output/u-boot.bin | grep -q 'dizi12345678' \
            || { echo "::error::dizi.env NOT embedded"; exit 1; }
          dtc -I dtb -O dts .output/u-boot.dtb -o .output/u-boot-decompiled.dts
          grep -q 'b8000000' .output/u-boot-decompiled.dts \
            || { echo "::error::framebuffer not at 0xb8000000"; exit 1; }
          echo "--- framebuffer node ---"
          grep -A8 'simple-framebuffer' .output/u-boot-decompiled.dts

      - name: Create Android Boot Image
        run: |
          dd if=/dev/zero of=empty_ramdisk bs=1 count=0
          mkbootimg --kernel .output/u-boot.bin \
                    --ramdisk empty_ramdisk \
                    --cmdline "console=ttyMSM0,115200n8" \
                    --base 0x80000000 \
                    --kernel_offset 0x00000000 \
                    --ramdisk_offset 0x01000000 \
                    --tags_offset 0x00000100 \
                    --pagesize 4096 \
                    --header_version 3 \
                    --output boot.img

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp boot.img                        artifacts/
          cp .output/u-boot.bin              artifacts/
          cp .output/u-boot.dtb              artifacts/
          cp .output/u-boot-decompiled.dts   artifacts/
          cp .output/System.map              artifacts/System.map
          cp .output/.config                 artifacts/config.txt
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-dizi-boot
          path: artifacts/
