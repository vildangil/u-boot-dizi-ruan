name: Build U-Boot for Dizi (SM7435)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure U-Boot
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output ARCH=arm64 dizi_defconfig

      - name: Build U-Boot
        run: make CROSS_COMPILE=aarch64-linux-gnu- O=.output ARCH=arm64 -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-dizi
          path: |
            .output/u-boot.img
            .output/u-boot.bin
            .output/u-boot