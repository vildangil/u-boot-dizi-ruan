name: Build U-Boot for Dizi (SM7435)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libgnutls28-dev

      - name: Configure U-Boot
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output dizi_defconfig
          ./scripts/config --file .output/.config -e OF_LIVE
          ./scripts/config --file .output/.config -e OF_BOARD_SETUP
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output olddefconfig

      - name: Build U-Boot
        run: make CROSS_COMPILE=aarch64-linux-gnu- O=.output -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-dizi
          path: |
            .output/u-boot.img
            .output/u-boot.bin
            .output/u-boot
